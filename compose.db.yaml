name: oathfront
services:
  db:
    image: oath-front-db
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    environment:
      POSTGRES_DB: oathfront_test
      POSTGRES_USER: oathfront_migrator
      POSTGRES_PASSWORD: ${OATHFRONT_DB_OWNER_PASSWORD:?Use --env-file .env.test.local}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - oathfront_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oathfront_migrator -d oathfront_test"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  oathfront_pgdata:
