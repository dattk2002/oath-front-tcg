name: oathfront
services:
  db:
    image: oath-front-db
    build: { context: ., dockerfile: docker/db/Dockerfile }
    environment:
      POSTGRES_DB: oathfront
      POSTGRES_USER: oathfront_migrator
      POSTGRES_PASSWORD: ${OATHFRONT_DB_OWNER_PASSWORD:?Set owner password}
    volumes: [oathfront_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U oathfront_migrator -d oathfront"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    image: oath-front-api
    build: { context: ., dockerfile: docker/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://oathfront_runtime:${OATHFRONT_DB_RUNTIME_PASSWORD:?Set runtime password}@db:5432/oathfront
      APP_ORIGIN: ${APP_ORIGIN:?Set browser origin}
      PUBLIC_REALTIME_URL: ${PUBLIC_REALTIME_URL:-ws://localhost:${UI_PORT:-3000}/realtime/matches}
      SESSION_SECRET: ${SESSION_SECRET:?Set session secret}
      UI_PROXY_SECRET: ${UI_PROXY_SECRET:?Set proxy secret}
      CLIENT_IP_MODE: trusted-next
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
    stop_grace_period: 15s
  ui:
    image: oath-front-ui
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
      args:
        API_ORIGIN: "http://api:3001"
        APP_ORIGIN: ${APP_ORIGIN:?Set browser origin}
    environment:
      API_ORIGIN: http://api:3001
      UI_PROXY_SECRET: ${UI_PROXY_SECRET:?Set proxy secret}
    ports: ["127.0.0.1:${UI_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
    stop_grace_period: 15s
volumes:
  oathfront_data:
